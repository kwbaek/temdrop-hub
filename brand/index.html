<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>템드랍 프로필 이미지 다운로드</title>
<style>
body{background:#090c14;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;padding:24px 16px 56px;max-width:480px;margin:0 auto;text-align:center;line-height:1.5}
h1{font-size:21px;font-weight:800;margin-bottom:8px}
.guide{background:rgba(79,209,255,.12);border:1px solid rgba(79,209,255,.3);color:#bfefff;border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:22px;text-align:left}
.card{background:#121726;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:18px}
.card h2{font-size:16px;margin-bottom:12px;color:#ffec62}
.preview{width:220px;height:220px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.18);margin:0 auto 14px;display:block}
a.btn{display:inline-block;background:#2b7fff;color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:12px;text-decoration:none}
</style>
</head>
<body>
<h1>@temdroplab 프로필 이미지</h1>
<div class="guide">
  <strong>📱 아이폰/모바일 저장 방법</strong><br>
  1. 아래 동그란 이미지를 <strong>길게 꾹 누르기 → "사진 앱에 저장"</strong><br>
  2. 유튜브 앱 내 채널 → <strong>연필 아이콘(채널 수정)</strong> → 상단 프로필 동그라미 터치 후 저장한 사진 선택
</div>

<div class="card">
  <h2>버전 1 · 순수 3D 코어 아이콘 (추천)</h2>
  <img class="preview" src="icon_science_lab.png" alt="3D Science Core Icon">
  <a class="btn" href="icon_science_lab.png" download="temdrop_icon_science_lab.png">원본 PNG 열기 / 다운로드</a>
</div>

<div class="card">
  <h2>버전 2 · '템드랍' 워드마크 포함</h2>
  <img class="preview" src="icon_science_wordmark.png" alt="TemDrop Wordmark Icon">
  <a class="btn" href="icon_science_wordmark.png" download="temdrop_icon_wordmark.png">원본 PNG 열기 / 다운로드</a>
</div>
</body>
</html>
